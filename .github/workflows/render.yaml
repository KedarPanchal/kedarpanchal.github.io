name: Render
run-name: ${{ github.actor }} is rendering a resume and Jekyll site
on:
  push:
    paths:
      - data.yaml
      - resume.view.yaml
      - site.view.yaml
      - .github/workflows/render.yaml
      - src/render/renderer.py
      - site/**
    branches:
      - main
permissions:
  contents: write
  id-token: write
  pages: write
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      resume: ${{ steps.filter.outputs.resume }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Filter Changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            resume:
              - "data.yaml"
              - "resume.view.yaml"
              - "src/render/renderer.py"
              - ".github/workflows/render.yaml"
            site:
              - "data.yaml"
              - "site.view.yaml"
              - "src/render/renderer.py"
              - "site/**"
              - ".github/workflows/render.yaml"

  render:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:debian
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Make Resume Folder
        run: mkdir -p dist/resume
      - name: Make Site Folder
        run: mkdir -p dist/site
      - name: Render Resume and Jekyll Site
        run: uv run render
      - name: Upload Resume
        uses: actions/upload-artifact@v7
        with:
          name: resume-tex
          path: dist/resume/resume.tex
      - name: Upload Jekyll Site
        uses: actions/upload-artifact@v7
        with:
          name: jekyll-markdown
          path: dist/site
          if-no-files-found: error

  build-resume:
    runs-on: ubuntu-latest
    needs: [changes, render]
    if: ${{ needs.changes.outputs.resume == 'true' }}
    container:
      image: texlive/texlive:latest
    steps:
      - name: Download Resume Artifact
        uses: actions/download-artifact@v7
        with:
          name: resume-tex
      - name: Build Resume PDF
        run: pdflatex -interaction=nonstopmode resume.tex
      - name: Upload Resume PDF
        uses: actions/upload-artifact@v7
        with:
          name: resume-pdf
          path: resume.pdf

  build-site:
    runs-on: ubuntu-latest
    needs: [changes, render]
    if: ${{ needs.changes.outputs.site == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.6
          bundler-cache: true
          working-directory: site
      - name: Download Jekyll Site Artifact
        uses: actions/download-artifact@v7
        with:
          name: jekyll-markdown
          path: site
      - name: Build Jekyll Site
        run: cd site && bundle exec jekyll build --destination ./_site
      - name: Upload Jekyll Site Build to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  release-resume:
    runs-on: ubuntu-latest
    needs: build-resume
    steps:
      - name: Download Resume PDF Artifact
        uses: actions/download-artifact@v7
        with:
          name: resume-pdf
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          NAME="$(date +'%Y.%m.%d')-${SHA:0:6}"
          gh release create "$NAME" resume.pdf --repo "${GITHUB_REPOSITORY}" --title "v$NAME"

  deploy-site:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
